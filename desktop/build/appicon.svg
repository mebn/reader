<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs><clipPath id="sq"><rect x="52" y="52" width="920" height="920" rx="210"/></clipPath>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="16"/></filter></defs>
  <rect x="60" y="76" width="904" height="904" rx="206" fill="#000" opacity="0.35" filter="url(#drop)"/>
  <g clip-path="url(#sq)">
  <g transform="translate(512 512) scale(0.9) translate(-512 -512)">
  
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3a1b9c"/>
      <stop offset="0.5" stop-color="#1a1160"/>
      <stop offset="1" stop-color="#0a0a3a"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#7a5cff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#4a38d8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4a38d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="3" fill="#fff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="dotfade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1024" height="1024" fill="url(#dotfade)"/></mask>

    <linearGradient id="cover" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#ffc24d"/>
      <stop offset="0.36" stop-color="#ff7f8a"/>
      <stop offset="0.7" stop-color="#b56cff"/>
      <stop offset="1" stop-color="#6cc4ff"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a45e0"/>
      <stop offset="1" stop-color="#2a2fb8"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6ff"/>
      <stop offset="1" stop-color="#d9d2ff"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a0a6a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2a0a6a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.22" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1066"/>
      <stop offset="1" stop-color="#0d0a3f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9ccff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9e6"/>
    </linearGradient>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="coverclip"><rect x="318" y="236" width="392" height="548" rx="52"/></clipPath>
    <clipPath id="labelclip"><rect x="418" y="468" width="262" height="168" rx="40"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#dots)" mask="url(#dotmask)"/>
  <rect width="1024" height="1024" fill="url(#aura)"/>

  <g transform="translate(512 512) scale(1.32) translate(-522 -518)">
  <!-- ground shadow and glow -->
  <ellipse cx="520" cy="826" rx="210" ry="26" fill="#05051f" opacity="0.7" filter="url(#blur18)"/>
  <rect x="318" y="236" width="392" height="548" rx="52" fill="url(#cover)" opacity="0.55" filter="url(#blur40)"/>

  <!-- back cover and page block give the book its thickness -->
  <rect x="334" y="252" width="392" height="548" rx="52" fill="url(#back)"/>
  <rect x="326" y="244" width="392" height="548" rx="52" fill="url(#pages)"/>
  <rect x="326" y="244" width="392" height="548" rx="52" fill="none" stroke="#9a8cf0" stroke-opacity="0.35" stroke-width="3"/>

  <!-- front cover -->
  <rect x="318" y="236" width="392" height="548" rx="52" fill="url(#cover)"/>
  <g clip-path="url(#coverclip)">
    <rect x="318" y="236" width="96" height="548" fill="url(#spine)"/>
    <rect x="410" y="236" width="4" height="548" fill="#fff" opacity="0.38"/>
    <rect x="414" y="236" width="3" height="548" fill="#3a0a7a" opacity="0.18"/>
    <rect x="318" y="236" width="392" height="548" fill="url(#gloss)"/>
    <!-- rim light -->
    <rect x="321" y="239" width="386" height="542" rx="49" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="5" filter="url(#blur4)"/>
  </g>
  <rect x="319.5" y="237.5" width="389" height="545" rx="50.5" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="3"/>

  <!-- bookmark ribbon -->
  <path d="M600 236h66v158l-33-26-33 26z" fill="url(#ribbon)"/>
  <path d="M600 236h10v146l-10 8z" fill="#fff" opacity="0.5"/>

  <!-- recessed label with glowing title lines -->
  <rect x="418" y="468" width="262" height="168" rx="40" fill="url(#label)"/>
  <g clip-path="url(#labelclip)">
    <rect x="418" y="468" width="262" height="12" fill="#000" opacity="0.35"/>
    <rect x="418" y="624" width="262" height="12" fill="#8f7dff" opacity="0.28"/>
  </g>
  <rect x="466" y="518" width="166" height="26" rx="13" fill="#9a86ff" opacity="0.7" filter="url(#blur18)"/>
  <rect x="466" y="518" width="166" height="26" rx="13" fill="url(#bar)"/>
  <rect x="466" y="562" width="104" height="26" rx="13" fill="url(#bar)" opacity="0.62"/>

  </g>
  </g></g>
</svg>