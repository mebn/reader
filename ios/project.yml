name: Reader
options:
  bundleIdPrefix: com.mebn
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  # The sync server, fixed at build time like the desktop app's VITE_SERVER_URL.
  configs:
    Debug:
      READER_SERVER_URL: http://localhost:8080
    Release:
      READER_SERVER_URL: https://reader.marnil.dev
targets:
  Reader:
    type: application
    platform: iOS
    sources:
      - path: Reader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mebn.reader
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Reader/Info.plist
        CODE_SIGN_STYLE: Automatic
  ReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReaderTests
    dependencies:
      - target: Reader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mebn.reader.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Reader.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Reader
        BUNDLE_LOADER: $(TEST_HOST)
  ReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReaderUITests
    dependencies:
      - target: Reader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mebn.reader.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Reader
schemes:
  Reader:
    build:
      targets:
        Reader: all
    test:
      targets:
        - ReaderTests
        - ReaderUITests
